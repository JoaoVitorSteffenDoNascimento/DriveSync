appId: com.drivesync.desktop
productName: DriveSync
executableName: drivesync
copyright: Copyright © 2026 DriveSync
electronVersion: 36.9.5
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  icon: build/icon.png
  artifactName: DriveSync-Windows-x64.${ext}
  extraResources:
    - from: resources/bin/win
      to: bin
      filter:
        - '**/*'
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
nsis:
  artifactName: DriveSync-Setup-Windows-x64.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
msi:
  artifactName: DriveSync-Windows-x64.msi
linux:
  icon: build/icon.png
  artifactName: DriveSync-Linux-x64.${ext}
  extraResources:
    - from: resources/bin/linux
      to: bin
      filter:
        - '**/*'
  category: Utility;Network;FileTransfer
  maintainer: DriveSync <contato@drivesync.local>
  synopsis: Sincronização simples com Google Drive e Drive Master
  description: >
    App simples multiplataforma para sincronizar pastas locais com o Google Drive,
    com suporte a múltiplos dispositivos, modo Drive Master com filtro de remetentes
    e limitação de até 4 GB por upload.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: pacman
      arch:
        - x64
deb:
  depends:
    - libnotify4
    - libnss3
    - libxss1
rpm:
  depends:
    - libnotify
    - nss
